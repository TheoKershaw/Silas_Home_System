<!DOCTYPE html>
<html>
<head>
    <title>Silas</title>

    <style>
        :root {
            --bg: #0a0c11;
            --bg-soft: #12151d;
            --violet: #6c5ce7;
            --teal: #14d6c4;
            --ember: #ff8a5b;
            --ink: #e9ebf3;
            --ink-dim: #7a7f92;
        }
 
        * {
            box-sizing: border-box;
        }
 
        html, body {
            height: 100%;
            margin: 0;
        }
 
        body {
            background: radial-gradient(circle at 50% 30%, var(--bg-soft), var(--bg) 70%);
            color: var(--ink);
            font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
 
        .stage {
            position: relative;
            width: min(70vw, 320px);
            height: min(70vw, 320px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
 
        .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.4s ease, opacity 0.4s ease, border-color 0.4s ease;
        }
 
        .ring--outer {
            animation: breathe 4.5s ease-in-out infinite;
        }
 
        .ring--mid {
            inset: 12%;
            animation: breathe 4.5s ease-in-out infinite 0.3s;
        }
 
        #orb {
            position: relative;
            width: 46%;
            height: 46%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, var(--teal), var(--violet) 55%, #241b4d 100%);
            box-shadow:
                0 0 30px 6px rgba(108, 92, 231, 0.35),
                0 0 80px 20px rgba(20, 214, 196, 0.12);
            transform: scale(1);
            transition: transform 0.08s ease-out, box-shadow 0.15s ease-out, background 0.6s ease;
            will-change: transform, box-shadow;
        }
 
        #orb.command {
            background: radial-gradient(circle at 35% 30%, var(--ember), var(--violet) 55%, #241b4d 100%);
        }
 
        #orb.thinking {
            animation: spin-pulse 1.1s ease-in-out infinite;
        }
 
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.06); opacity: 1; }
        }
 
        @keyframes spin-pulse {
            0%, 100% { transform: scale(0.94); }
            50% { transform: scale(1.02); }
        }
 
        .caption {
            margin-top: 42px;
            text-align: center;
            max-width: 480px;
            padding: 0 24px;
        }
 
        #status {
            font-size: 14px;
            letter-spacing: 0.02em;
            color: var(--ink-dim);
            margin: 0 0 8px 0;
            text-transform: uppercase;
            font-weight: 600;
        }
 
        #text {
            font-size: 19px;
            line-height: 1.4;
            margin: 0;
            min-height: 27px;
            color: var(--ink);
            font-weight: 400;
        }
    </style>
</head>

<body>

    <p id="status">Starting microphone...</p>
    <p id="text"></p>

<script>
    const status = document.getElementById("status");
    const text = document.getElementById("text");

    let stream;
    let recorder;
    let chunks = [];

    let mode = "wake";
    let busy = false;

    const SILENCE = 0.02;
    const SILENCE_TIME = 900;
    const MAX_TIME = 6000;


    async function start() {

        stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        status.textContent = 'Listening for "silas"...';

        listen();
    }

    function speak(text) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-GB";
        speechSynthesis.speak(utterance);
    }


    function listen() {

        if (busy) return;

        chunks = [];

        const audioContext =
            new AudioContext();

        const source =
            audioContext.createMediaStreamSource(stream);

        const analyser =
            audioContext.createAnalyser();

        analyser.fftSize = 512;

        source.connect(analyser);

        const data =
            new Uint8Array(analyser.fftSize);

        recorder =
            new MediaRecorder(stream);

        recorder.ondataavailable = e => {
            if (e.data.size > 0) {
                chunks.push(e.data);
            }
        };

        let speaking = false;
        let speechStart = 0;
        let silenceStart = null;

        recorder.onstop = async () => {

            audioContext.close();

            if (speaking) {

                const blob = new Blob(
                    chunks,
                    { type: "audio/webm" }
                );

                await send(blob);
            }

            if (!busy) {
                listen();
            }
        };

        recorder.start();

        function check() {

            if (recorder.state !== "recording") {
                return;
            }

            analyser.getByteTimeDomainData(data);

            let sum = 0;

            for (let i = 0; i < data.length; i++) {

                const value =
                    (data[i] - 128) / 128;

                sum += value * value;
            }

            const rms =
                Math.sqrt(sum / data.length);

            const now = Date.now();

            if (rms > SILENCE) {

                silenceStart = null;

                if (!speaking) {

                    speaking = true;
                    speechStart = now;

                    status.textContent =
                        mode === "wake"
                        ? 'Listening for "silas"...'
                        : "Listening for instruction...";
                }

            } else if (speaking) {

                if (silenceStart === null) {
                    silenceStart = now;
                }

                if (
                    now - silenceStart >= SILENCE_TIME
                ) {

                    recorder.stop();
                    return;
                }
            }

            if (
                speaking &&
                now - speechStart >= MAX_TIME
            ) {

                recorder.stop();
                return;
            }

            requestAnimationFrame(check);
        }

        check();
    }


    async function send(blob) {

        busy = true;

        status.textContent = "Processing...";

        const form = new FormData();
        form.append("audio", blob, "audio.webm");

        try {

            const response = await fetch("/transcribe", {
                method: "POST",
                body: form
            });

            const data = await response.json();

            if (data.error) {
                status.textContent = data.error;
                return;
            }

            console.log("Recognised:", data.text);

            if (data.response) {
                // Wake word + command arrived in the same utterance — already answered.
                text.textContent = data.text;
                speak(data.response);
                mode = "wake";
                status.textContent = 'Listening for "silas"...';

            } else if (mode === "wake") {

                if (data.wake_word) {
                    mode = "command";
                    text.textContent = "Silas";
                    status.textContent = "Silas detected — waiting for instruction.";
                } else {
                    status.textContent = 'Listening for "silas"...';
                }

            } else {
                text.textContent = data.text;
                console.log("COMMAND:", data.text);
                mode = "wake";
                status.textContent = 'Listening for "silas"...';
            }

        } catch (error) {

            console.error(error);
            status.textContent = "Connection error";

        } finally {

            busy = false;
        }
    }

    window.addEventListener(
        "load",
        async () => {

            try {

                await start();

            } catch (error) {

                console.error(error);

                status.textContent =
                    "Microphone permission required.";
            }
        }
    );

</script>

</body>
</html>
